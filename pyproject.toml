[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-image-audit"
version = "0.17.1"
description = "Shopify store image audit - Lighthouse-based analysis with heuristic and ML scoring"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "xopsio"},
]
keywords = [
    "shopify",
    "lighthouse",
    "image-audit",
    "performance",
    "pagespeed",
    "audit",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.20,<5",
    "pydantic>=2.6,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<16",
    "requests>=2.31,<3",
    # Token encryption for tokens.json (Sprint 20). Both packages are
    # cross-platform: macOS Keychain / Windows Credential Manager / Linux
    # Secret Service. ``secretstorage`` is the Linux backend only.
    "cryptography>=42,<51",
    "keyring>=24,<26",
    "secretstorage>=3.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
# PDF export requires WeasyPrint + native libraries
# (libpango, libcairo, libgdk-pixbuf). Install with:
#   pip install shopify-image-audit[pdf]
pdf = ["weasyprint>=69.0,<70"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "syrupy>=4.6",
    "ruff>=0.4",
    "mypy>=1.10",
    "responses>=0.25",
    "build>=1.0",
    "twine>=5.0",
]  # + "shopify-image-audit[pdf]" for the PDF-rendering test suite

[project.scripts]
audit = "engine.cli:main"

[project.urls]
Homepage = "https://github.com/xopsio/shopify-image-audit"
Repository = "https://github.com/xopsio/shopify-image-audit"
Issues = "https://github.com/xopsio/shopify-image-audit/issues"

[tool.setuptools]
py-modules = ["_version"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# JSON Schema contract ships inside the wheel so installed users can read it
# via importlib.resources (Sprint 9, TD-2 — previously sdist-only via MANIFEST.in).
audit = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
# Sprint 10, TD-1: type checking is a CI gate.
# Sprint 13, TD-5: promoted to `strict = true` — zero ignore comments,
# every def typed. The mechanical annotation sweep is documented in the
# [0.10.0] CHANGELOG entry.
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# WeasyPrint ships no type stubs (no py.typed); the render path is a thin
# wrapper around it, so untyped imports are acceptable.
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: Typer's official pattern is typer.Option()/typer.Argument() in default
# arguments — this is how Typer documents CLI definition, so the lint is a
# false positive for this framework.
ignore = ["B008"]
