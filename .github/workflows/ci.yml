name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # WeasyPrint needs native libraries (pango, cairo, gdk-pixbuf, ...)
      # for PDF rendering. Install them before tests so the PDF tests
      # (`tests/test_report_pdf.py`) can render. If a future PR stops
      # depending on WeasyPrint, this step can be removed.
      - name: Install WeasyPrint system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Test (pytest + coverage)
        run: pytest --cov=src --cov-fail-under=85 --cov-report=term-missing -q

      - name: Smoke test (CLI help)
        run: audit --help