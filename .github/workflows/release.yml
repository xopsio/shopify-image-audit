name: release

# Two trigger paths:
# 1. Push of a version tag (e.g. v0.2.0) — build, validate, and publish.
# 2. workflow_dispatch — build and validate only. Manual runs never publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel only a duplicate run for the same event and ref. Keeping event types
# separate prevents a manual dry-run from cancelling a real tag release.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Keep the PyPI environment gate and OIDC permission scoped to this job.
    environment: pypi
    permissions:
      id-token: write
      # Required for the provenance attestation step below.
      attestations: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      # SLSA build-provenance attestation: cryptographically signs the
      # artifacts so downstream consumers can verify their origin. Uses
      # the existing OIDC id-token. Non-blocking so provenance failure
      # doesn't block the PyPI publish.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: dist/*

      # Trusted publishing: no API token needed. PyPI verifies the
      # workflow identity via OIDC. Configure the trusted publisher
      # once at https://pypi.org/manage/project/shopify-image-audit/settings/publishing/
      # with:
      #   Owner: xopsio
      #   Repository: shopify-image-audit
      #   Workflow: release.yml
      #   Environment: pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
