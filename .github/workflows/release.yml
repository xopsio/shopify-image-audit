name: release

# Trigger on version tags (e.g. v0.2.0, v0.2.1, v1.0.0).
# The actual `git tag vX.Y.Z && git push --tags` is a manual step
# performed by the maintainer after the release-prep PR is merged.
on:
  push:
    tags: ['v*']

# Cancel any in-progress release for the same tag (e.g. on a force-push
# to the tag). We don't cancel cross-tag because every release is its own
# event and we'd rather let it finish than skip it.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

# Required permissions for PyPI Trusted Publishing (OIDC). Without these,
# the publish step cannot mint a short-lived PyPI token.
permissions:
  id-token: write

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    # The "pypi" environment is a GitHub-side gate: it lets the maintainer
    # require manual approval before publishing. Configure this environment
    # at https://github.com/xopsio/shopify-image-audit/settings/environments
    # if you want a human-in-the-loop before each release.
    environment: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      # Twine check is redundant here (gh-action-pypi-publish runs it
      # internally) but it makes the build step's output easier to debug
      # when a release fails.
      - name: Validate distribution metadata
        run: python -m twine check dist/*

      # Trusted publishing: no API token needed. PyPI verifies the
      # workflow identity via OIDC. Configure the trusted publisher
      # once at https://pypi.org/manage/project/shopify-image-audit/settings/publishing/
      # with:
      #   Owner: xopsio
      #   Repository: shopify-image-audit
      #   Workflow: release.yml
      #   Environment: pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
